<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ハウスルール | TRPG_mug</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Zen+Kaku+Gothic+Antique:wght@400;500;700&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --base: #f5f1e9;
      --surface: #fbf8f2;
      --surface-2: #eee8dd;

      --text: #000000;
      --subtext: #5f5752;
      --line: #cfc5b8;

      --blue: #579db7;
      --red: #e5483f;
      --yellow: #f4b84e;
      --teal: #16a39a;

      --header-height: 180px;
      --right-width: 205px;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;

      color: var(--text);
      background: var(--base);

      font-family:
        "Zen Kaku Gothic Antique",
        sans-serif;

      font-size: 14px;
      line-height: 1.8;
    }

    a {
      color: var(--blue);
    }

    .page {
      position: relative;

      width: 100%;
      height: 100vh;

      overflow: hidden;

      background: var(--base);
    }


    /* ========================================
       青ヘッダー
       ======================================== */

    .hero {
      position: fixed;

      z-index: 10;

      top: 0;
      left: 0;
      right: 0;

      height: var(--header-height);

      background: var(--blue);
    }


    /* ========================================
       HOUSE RULE 荷札
       ======================================== */

    .page-label {
      position: absolute;

      right: 175px;
      top: 36px;

      display: flex;
      align-items: center;
      justify-content: center;

      width: 335px;
      height: 92px;

      padding-right: 30px;

      color: #ffffff;
      background: var(--red);

      font-family:
        "Oswald",
        sans-serif;

      font-size: 43px;
      font-weight: 500;
      letter-spacing: 0.02em;

      transform: rotate(7deg);

      box-shadow:
        0 5px 0 rgba(0, 0, 0, 0.05);
    }

    .page-label::after {
      content: "";

      position: absolute;

      right: -46px;

      width: 92px;
      height: 92px;

      border-radius: 50%;

      background: var(--red);
    }

    .page-label::before {
      content: "";

      position: absolute;

      z-index: 2;

      right: -25px;

      width: 23px;
      height: 23px;

      border-radius: 50%;

      background: var(--blue);
    }


    /* ========================================
       もどる
       ======================================== */

    .back-ticket {
      position: fixed;

      z-index: 40;

      top: 54px;
      left: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      width: 150px;
      height: 42px;

      padding-right: 10px;

      color: #ffffff;
      background: var(--red);

      font-size: 13px;
      font-weight: 700;

      text-decoration: none;

      filter:
        drop-shadow(5px 5px 0 var(--blue));

      transition:
        transform 0.15s ease,
        filter 0.15s ease;
    }

    .back-ticket::after {
      content: "";

      position: absolute;

      z-index: -1;

      top: 0;
      right: -21px;

      width: 42px;
      height: 42px;

      border-radius: 50%;

      background: var(--red);
    }

    .back-ticket::before {
      content: "";

      position: absolute;

      z-index: 2;

      top: 50%;
      right: -10px;

      width: 8px;
      height: 8px;

      border-radius: 50%;

      background: var(--blue);

      transform:
        translateY(-50%);
    }

    .back-ticket:hover {
      transform:
        translateY(-2px);

      filter:
        drop-shadow(5px 7px 0 var(--blue));
    }


    /* ========================================
       本文エリア
       ======================================== */

    .main {
      position: fixed;

      top: var(--header-height);
      left: 0;
      right: var(--right-width);
      bottom: 0;

      overflow: hidden;

      background: var(--base);
    }

    .content-scroll {
      width: 100%;
      height: 100%;

      overflow-y: auto;
      overflow-x: hidden;

      scrollbar-gutter: stable;

      scrollbar-width: thin;

      scrollbar-color:
        var(--blue)
        #ded8ce;
    }

    .content-scroll::-webkit-scrollbar {
      width: 13px;
    }

    .content-scroll::-webkit-scrollbar-track {
      background: #ded8ce;

      border-radius: 999px;

      margin:
        14px
        0;
    }

    .content-scroll::-webkit-scrollbar-thumb {
      background: var(--blue);

      border:
        3px solid #ded8ce;

      border-radius: 999px;
    }

    .content-scroll::-webkit-scrollbar-thumb:hover {
      background: var(--teal);
    }

    .content {
      width: min(
        800px,
        calc(100% - 48px)
      );

      min-height: 100%;

      margin:
        0 auto;

      padding:
        38px
        24px
        90px;
    }


    /* ========================================
       ページ内タイトル
       ======================================== */

    .house-rule-heading {
      display: flex;
      align-items: baseline;

      gap: 28px;

      margin:
        0 0 28px;

      padding-bottom:
        10px;

      border-bottom:
        2px solid var(--text);

      line-height: 1.4;
    }

    .house-rule-label {
      font-family:
        "Oswald",
        sans-serif;

      font-size: 25px;
      font-weight: 600;
    }

    .house-rule-system {
      font-family:
        "Oswald",
        "Zen Kaku Gothic Antique",
        sans-serif;

      font-size: 22px;
      font-weight: 600;
    }


    /* ========================================
       本文
       scenario.html と同じ
       ======================================== */

    .section {
      margin:
        38px 0;
    }

    .heading {
      position: relative;

      margin-top:
        52px;

      margin-bottom:
        20px;

      padding:
        0 0 6px 16px;

      font-size:
        18px;

      line-height:
        1.5;

      font-weight:
        700;

      border-bottom:
        1px solid var(--line);
    }

    .heading::before {
      content: "";

      position: absolute;

      left: 0;
      top: 0.45em;

      width: 8px;
      height: 8px;

      background: var(--red);
    }

    .subheading {
      margin-top:
        30px;

      margin-bottom:
        10px;

      font-size:
        15px;

      font-weight:
        700;

      color:
        var(--blue);
    }

    p {
      margin:
        0 0 1.2em;
    }

    .center {
      margin:
        38px 0;

      text-align:
        center;
    }

    .box {
      margin:
        32px 0;

      padding:
        18px 22px;

      border:
        1px solid var(--line);

      background:
        var(--surface);

      box-shadow:
        4px 4px 0 var(--blue);
    }

    .box-title {
      margin-bottom:
        8px;

      font-weight:
        700;

      color:
        var(--red);
    }

    details {
      margin:
        32px 0;

      border:
        1px solid var(--line);

      background:
        var(--surface);

      overflow:
        hidden;
    }

    summary {
      cursor:
        pointer;

      padding:
        14px 18px;

      font-weight:
        700;

      background:
        var(--surface-2);
    }

    summary:hover {
      filter:
        brightness(0.97);
    }

    details[open] summary {
      border-bottom:
        2px solid var(--blue);
    }

    .accordion-body {
      padding:
        18px 20px 6px;
    }

    .quote {
      margin:
        32px 0;

      padding-left:
        20px;

      border-left:
        4px solid var(--teal);

      color:
        var(--subtext);

      font-style:
        italic;
    }

    .scenario-image {
      display:
        block;

      max-width:
        100%;

      height:
        auto;

      margin-top:
        12px;
    }

    .image-caption {
      margin-top:
        6px;

      font-size:
        12px;

      color:
        var(--subtext);
    }


    /* ========================================
       文字装飾
       ======================================== */

    .red {
      color:
        var(--red);
    }

    .yellow {
      color:
        #b87a00;
    }

    .blue {
      color:
        var(--blue);
    }

    .underline {
      text-decoration:
        underline;
    }


    /* ========================================
       右 共通ナビ
       ======================================== */

    .right-nav {
      position: fixed;

      z-index: 30;

      top: 285px;
      right: 0;

      width: 160px;

      display: flex;
      flex-direction: column;
      align-items: flex-end;

      gap: 11px;

      pointer-events: none;
    }

    .nav-ticket {
      position: relative;

      display: flex;
      align-items: center;
      justify-content: center;

      width: 220px;
      min-height: 48px;

      margin-right: -82px;

      padding:
        12px
        48px
        12px
        12px;

      color: #ffffff;
      background: var(--blue);

      text-align: center;
      text-decoration: none;

      font-family:
        "Oswald",
        sans-serif;

      font-size: 17px;
      letter-spacing: 0.02em;

      box-shadow:
        0 3px 0 rgba(0, 0, 0, 0.12);

      transition:
        transform 0.15s,
        background 0.15s;

      pointer-events: auto;
    }

    .nav-ticket::before {
      content: "";

      position: absolute;

      left: -10px;
      top: 50%;

      width: 20px;
      height: 20px;

      border-radius: 50%;

      background: var(--base);

      transform:
        translateY(-50%);
    }

    .nav-ticket:hover {
      transform:
        translateX(-14px);
    }

    .nav-ticket.current {
      background: var(--red);

      transform:
        translateX(20px);
    }

    .nav-ticket.current:hover {
      transform:
        translateX(6px);
    }


    /* ========================================
       右 SYSTEM タグ
       ======================================== */

    .house-system-nav {
      position: fixed;

      z-index: 30;

      top: 535px;
      right: 0;

      width: 160px;

      display: flex;
      flex-direction: column;
      align-items: flex-end;

      gap: 11px;

      pointer-events: none;
    }

    .system-ticket {
      position: relative;

      display: flex;
      align-items: center;
      justify-content: center;

      width: 220px;
      min-height: 48px;

      margin-right:
        -82px;

      padding:
        12px
        48px
        12px
        12px;

      color: #ffffff;
      background: var(--blue);

      text-align: center;
      text-decoration: none;

      font-family:
        "Oswald",
        "Zen Kaku Gothic Antique",
        sans-serif;

      font-size: 17px;
      letter-spacing: 0.02em;

      box-shadow:
        0 3px 0 rgba(0, 0, 0, 0.12);

      transition:
        transform 0.15s,
        background 0.15s;

      pointer-events: auto;
    }

    .system-ticket::before {
      content: "";

      position: absolute;

      left: -10px;
      top: 50%;

      width: 20px;
      height: 20px;

      border-radius: 50%;

      background: var(--base);

      transform:
        translateY(-50%);
    }

    .system-ticket:hover {
      transform:
        translateX(-14px);
    }

    .system-ticket.current {
      background:
        var(--red);

      transform:
        translateX(20px);
    }

    .system-ticket.current:hover {
      transform:
        translateX(6px);
    }


    /* ========================================
       エラー
       ======================================== */

    .error {
      padding:
        20px;

      border:
        1px solid var(--red);

      background:
        var(--surface);
    }


    /* ========================================
       スマホ・タブレット
       ======================================== */

    @media (max-width: 760px) {

      :root {
        --header-height:
          125px;
      }

      html,
      body {
        height: auto;
      }

      body {
        overflow: auto;

        font-size:
          13px;
      }

      .page {
        height: auto;

        overflow:
          visible;
      }

      .hero {
        position:
          relative;
      }

      .page-label {
        right:
          28px;

        top:
          32px;

        width:
          230px;

        height:
          62px;

        font-size:
          29px;
      }

      .page-label::after {
        right:
          -31px;

        width:
          62px;

        height:
          62px;
      }

      .page-label::before {
        right:
          -18px;

        width:
          17px;

        height:
          17px;
      }

      .back-ticket {
        top:
          20px;

        width:
          130px;

        height:
          40px;

        font-size:
          12px;
      }

      .back-ticket::after {
        right:
          -20px;

        width:
          40px;

        height:
          40px;
      }

      .main {
        position:
          relative;

        top:
          auto;

        left:
          auto;

        right:
          auto;

        bottom:
          auto;

        overflow:
          visible;
      }

      .content-scroll {
        height:
          auto;

        overflow:
          visible;
      }

      .content {
        width:
          min(
            100%,
            800px
          );

        padding:
          34px
          20px
          70px;
      }

      .right-nav {
        position:
          absolute;

        top:
          10px;

        left:
          10px;

        right:
          auto;

        width:
          auto;

        flex-direction:
          row;

        align-items:
          center;

        gap:
          6px;
      }

      .nav-ticket {
        width:
          auto;

        min-height:
          0;

        margin:
          0;

        padding:
          6px
          9px;

        font-size:
          11px;

        transform:
          none;
      }

      .nav-ticket::before {
        display:
          none;
      }

      .nav-ticket:hover,
      .nav-ticket.current,
      .nav-ticket.current:hover {
        transform:
          none;
      }

      .nav-ticket.current {
        position:
          relative;

        top:
          4px;
      }

      .house-system-nav {
        position:
          absolute;

        top:
          132px;

        left:
          10px;

        right:
          auto;

        width:
          calc(100% - 20px);

        flex-direction:
          row;

        flex-wrap:
          wrap;

        align-items:
          center;

        gap:
          6px;
      }

      .system-ticket {
        width:
          auto;

        min-height:
          0;

        margin:
          0;

        padding:
          6px
          9px;

        font-size:
          11px;

        transform:
          none;
      }

      .system-ticket::before {
        display:
          none;
      }

      .system-ticket:hover,
      .system-ticket.current,
      .system-ticket.current:hover {
        transform:
          none;
      }

      .system-ticket.current {
        position:
          relative;

        top:
          4px;
      }

      .house-rule-heading {
        margin-top:
          30px;

        gap:
          18px;
      }

      .house-rule-label {
        font-size:
          22px;
      }

      .house-rule-system {
        font-size:
          19px;
      }

      .heading {
        font-size:
          17px;
      }

      .subheading {
        font-size:
          14px;
      }

      .box {
        padding:
          16px
          18px;
      }
    }

  </style>
</head>


<body>

  <div class="page">

    <header class="hero">

      <a
        class="back-ticket"
        href="index.html"
      >
        ◀ もどる
      </a>

      <div class="page-label">
        HOUSE RULE
      </div>

    </header>


    <main class="main">

      <div
        id="content-scroll"
        class="content-scroll"
      >

        <div
          id="house-rule"
          class="content"
        >
          読み込み中……
        </div>

      </div>

    </main>


    <nav
      class="right-nav"
      aria-label="サイトナビゲーション"
    >

      <a
        class="nav-ticket"
        href="index.html"
      >
        HOME
      </a>

      <a
        class="nav-ticket current"
        href="houserule.html"
      >
        HOUSE RULE
      </a>

      <a
        class="nav-ticket"
        href="scenarios.html"
      >
        SCENARIO
      </a>

    </nav>


    <nav
      id="system-nav"
      class="house-system-nav"
      aria-label="ハウスルールのシステム切り替え"
    ></nav>

  </div>


  <script>

    // ========================================
    // HTML特殊文字
    // ========================================

    function escapeHtml(text) {

      return String(text ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    // ========================================
    // 本文内の文字装飾
    //
    // **文字**         太字
    // {red:文字}       赤
    // {yellow:文字}    黄
    // {blue:文字}      青
    // {underline:文字} 下線
    // ========================================

    function formatText(text) {

      if (!text) {
        return "";
      }

      let result =
        escapeHtml(text);


      result =
        result.replace(
          /\*\*(.+?)\*\*/g,
          "<strong>$1</strong>"
        );


      result =
        result.replace(
          /\{red:(.+?)\}/g,
          '<span class="red">$1</span>'
        );


      result =
        result.replace(
          /\{yellow:(.+?)\}/g,
          '<span class="yellow">$1</span>'
        );


      result =
        result.replace(
          /\{blue:(.+?)\}/g,
          '<span class="blue">$1</span>'
        );


      result =
        result.replace(
          /\{underline:(.+?)\}/g,
          '<span class="underline">$1</span>'
        );


      result =
        result.replace(
          /\n/g,
          "<br>"
        );


      return result;
    }


    // ========================================
    // 本文パーツ
    // scenario.html と同じ
    // ========================================

    function createSection(section) {

      const type =
        section.type || "text";


      const heading =
        section.heading || "";


      const body =
        section.body || "";


      if (type === "heading") {

        return `
          <h2 class="heading">
            ${escapeHtml(heading)}
          </h2>
        `;
      }


      if (type === "subheading") {

        return `
          <h3 class="subheading">
            ${escapeHtml(heading)}
          </h3>
        `;
      }


      if (type === "center") {

        return `
          <div class="center">
            ${formatText(body)}
          </div>
        `;
      }


      if (type === "box") {

        return `
          <div class="box">

            ${
              heading
                ? `
                  <div class="box-title">
                    ${escapeHtml(heading)}
                  </div>
                `
                : ""
            }

            ${
              body
                ? `
                  <div>
                    ${formatText(body)}
                  </div>
                `
                : ""
            }

          </div>
        `;
      }


      if (type === "accordion") {

        return `
          <details>

            <summary>
              ${escapeHtml(
                heading || "詳細"
              )}
            </summary>

            <div class="accordion-body">
              ${formatText(body)}
            </div>

          </details>
        `;
      }


      if (type === "quote") {

        return `
          <div class="quote">

            ${
              heading
                ? `
                  <strong>
                    ${escapeHtml(heading)}
                  </strong>
                  <br>
                `
                : ""
            }

            ${formatText(body)}

          </div>
        `;
      }


      if (type === "link") {

        return `
          <div class="section">

            <a
              href="${escapeHtml(body)}"
              target="_blank"
              rel="noopener noreferrer"
            >
              ${escapeHtml(
                heading || body
              )} ↗
            </a>

          </div>
        `;
      }


      if (type === "image") {

        return `
          <div class="section">

            ${
              body
                ? `
                  <img
                    class="scenario-image"
                    src="${escapeHtml(body)}"
                    alt="${escapeHtml(heading)}"
                  >
                `
                : ""
            }

            ${
              heading
                ? `
                  <div class="image-caption">
                    ${escapeHtml(heading)}
                  </div>
                `
                : ""
            }

          </div>
        `;
      }


      return `
        <div class="section">

          ${
            heading
              ? `
                <h2 class="heading">
                  ${escapeHtml(heading)}
                </h2>
              `
              : ""
          }

          ${
            body
              ? `
                <div>
                  ${formatText(body)}
                </div>
              `
              : ""
          }

        </div>
      `;
    }


    // ========================================
    // システム切り替えタグ
    // ========================================

    function renderSystemNav(
      houseRules,
      currentSystem
    ) {

      const nav =
        document.getElementById(
          "system-nav"
        );


      nav.innerHTML =
        houseRules
          .map(
            rule => {

              const system =
                String(
                  rule.system || ""
                ).trim();


              const isCurrent =
                system === currentSystem;


              return `
                <a
                  class="system-ticket${
                    isCurrent
                      ? " current"
                      : ""
                  }"
                  href="houserule.html?system=${
                    encodeURIComponent(
                      system
                    )
                  }"
                >
                  ${escapeHtml(system)}
                </a>
              `;
            }
          )
          .join("");
    }


    // ========================================
    // ハウスルール本文
    // ========================================

    function renderHouseRule(rule) {

      let html = `
        <div class="house-rule-heading">

          <span class="house-rule-label">
            HOUSE RULE
          </span>

          <span class="house-rule-system">
            ${escapeHtml(
              rule.system
            )}
          </span>

        </div>
      `;


      if (
        Array.isArray(
          rule.sections
        )
      ) {

        rule.sections.forEach(
          section => {

            html +=
              createSection(
                section
              );

          }
        );
      }


      document
        .getElementById(
          "house-rule"
        )
        .innerHTML =
          html;


      document.title =
        rule.system +
        " ハウスルール | TRPG_mug";
    }


    // ========================================
    // data.json読み込み
    // ========================================

    fetch(
      "data.json?v=" +
      Date.now()
    )

      .then(
        response => {

          if (!response.ok) {

            throw new Error(
              "data.jsonを読み込めませんでした"
            );
          }


          return response.json();
        }
      )

      .then(
        data => {

          const houseRules =
            Array.isArray(
              data.houseRules
            )
              ? data.houseRules
                  .filter(
                    rule =>
                      rule &&
                      String(
                        rule.system || ""
                      ).trim()
                  )
              : [];


          if (
            houseRules.length === 0
          ) {

            throw new Error(
              "ハウスルールが登録されていません"
            );
          }


          const params =
            new URLSearchParams(
              window.location.search
            );


          const requestedSystem =
            String(
              params.get("system") || ""
            ).trim();


          const rule =
            houseRules.find(
              item =>
                String(
                  item.system || ""
                ).trim() ===
                requestedSystem
            ) ||
            houseRules[0];


          renderSystemNav(
            houseRules,
            String(
              rule.system || ""
            ).trim()
          );


          renderHouseRule(
            rule
          );

        }
      )

      .catch(
        error => {

          console.error(
            error
          );


          document
            .getElementById(
              "house-rule"
            )
            .innerHTML = `
              <div class="error">
                ハウスルールを読み込めませんでした。
              </div>
            `;

        }
      );

  </script>

</body>
</html>
