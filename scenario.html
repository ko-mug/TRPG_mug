<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>シナリオ | TRPG_mug</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 24px 80px;
      line-height: 1.8;
      color: #333;
      background: #fff;
    }

    a {
      color: #4776a8;
    }

    .back-link {
      margin-bottom: 28px;
      font-size: 14px;
    }

    .scenario-title {
      font-size: 32px;
      line-height: 1.4;
      border-bottom: 2px solid #333;
      padding-bottom: 10px;
    }

    /* メイン画像 */
    .main-image {
      display: block;
      width: 100%;
      max-height: 500px;
      object-fit: contain;
      margin: 24px 0;
      border-radius: 8px;
    }

    /* 概要 */
    .meta {
      background: #f5f5f5;
      padding: 18px 22px;
      margin: 24px 0 48px;
      border-radius: 8px;
    }

    .meta-row {
      margin: 3px 0;
    }

    /* 本文 */
    .section {
      margin: 38px 0;
    }

    .heading {
      font-size: 24px;
      margin-top: 52px;
      margin-bottom: 20px;
      padding-bottom: 6px;
      border-bottom: 1px solid #bbb;
    }

    .subheading {
      font-size: 18px;
      margin-top: 30px;
      margin-bottom: 10px;
    }

    p {
      margin: 0 0 1.2em;
    }

    /* BOX */
    .box {
      margin: 32px 0;
      padding: 18px 22px;
      border: 1px solid #bbb;
      border-radius: 8px;
      background: #fafafa;
    }

    .box-title {
      font-weight: bold;
      margin-bottom: 8px;
    }

    /* アコーディオン */
    details {
      margin: 32px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      overflow: hidden;
    }

    summary {
      cursor: pointer;
      padding: 14px 18px;
      font-weight: bold;
      background: #f5f5f5;
    }

    summary:hover {
      background: #eee;
    }

    .accordion-body {
      padding: 18px 20px 6px;
    }

    /* 引用 */
    .quote {
      margin: 32px 0;
      padding-left: 20px;
      border-left: 4px solid #aaa;
      font-style: italic;
    }

    /* 本文中の画像 */
    .scenario-image {
      display: block;
      max-width: 100%;
      height: auto;
      margin-top: 12px;
      border-radius: 6px;
    }

    .image-caption {
      margin-top: 6px;
      font-size: 13px;
      color: #777;
    }

    /* 文字装飾 */
    .red {
      color: #c0392b;
    }

    .yellow {
      color: #b8860b;
    }

    .blue {
      color: #286090;
    }

    .underline {
      text-decoration: underline;
    }

    /* ハウスルール */
    .house-rule {
      margin-top: 64px;
      padding: 22px 0;
      border-top: 1px solid #ccc;
    }

    .house-rule-title {
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 0.08em;
      color: #777;
      margin-bottom: 8px;
    }

    .house-rule a {
      font-weight: bold;
    }

    /* 権利表記 */
    .copyright {
      margin-top: 30px;
      padding-top: 22px;
      border-top: 1px solid #ddd;
      font-size: 12px;
      line-height: 1.7;
      color: #777;
    }

    .error {
      padding: 20px;
      background: #fff4f4;
      border: 1px solid #e0b4b4;
      border-radius: 8px;
    }

    @media (max-width: 600px) {
      body {
        margin-top: 24px;
        padding-left: 18px;
        padding-right: 18px;
      }

      .scenario-title {
        font-size: 27px;
      }

      .heading {
        font-size: 21px;
      }

      .main-image {
        max-height: 350px;
      }
    }
  </style>
</head>

<body>

  <div class="back-link">
    <a href="index.html">← シナリオ一覧へ戻る</a>
  </div>

  <main id="scenario">
    読み込み中……
  </main>


  <script>

    // ========================================
    // HTML特殊文字を安全にする
    // ========================================

    function escapeHtml(text) {
      return String(text ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    // ========================================
    // 本文内の装飾
    //
    // **文字**         → 太字
    // {red:文字}       → 赤
    // {yellow:文字}    → 黄
    // {blue:文字}      → 青
    // {underline:文字} → 下線
    // ========================================

    function formatText(text) {
      if (!text) return "";

      let result = escapeHtml(text);

      result = result.replace(
        /\*\*(.+?)\*\*/g,
        "<strong>$1</strong>"
      );

      result = result.replace(
        /\{red:(.+?)\}/g,
        '<span class="red">$1</span>'
      );

      result = result.replace(
        /\{yellow:(.+?)\}/g,
        '<span class="yellow">$1</span>'
      );

      result = result.replace(
        /\{blue:(.+?)\}/g,
        '<span class="blue">$1</span>'
      );

      result = result.replace(
        /\{underline:(.+?)\}/g,
        '<span class="underline">$1</span>'
      );

      result = result.replace(
        /\n/g,
        "<br>"
      );

      return result;
    }


    // ========================================
    // 概要欄
    // ========================================

    function createMetaRow(label, value) {
      if (!value) return "";

      return `
        <div class="meta-row">
          <strong>${escapeHtml(label)}：</strong>
          ${formatText(value)}
        </div>
      `;
    }


    // ========================================
    // 本文パーツ
    // ========================================

    function createSection(section) {
      const type = section.type || "text";
      const heading = section.heading || "";
      const body = section.body || "";

      if (type === "heading") {
        return `
          <h2 class="heading">
            ${escapeHtml(heading)}
          </h2>
        `;
      }

      if (type === "subheading") {
        return `
          <h3 class="subheading">
            ${escapeHtml(heading)}
          </h3>
        `;
      }

      if (type === "box") {
        return `
          <div class="box">
            ${
              heading
                ? `<div class="box-title">${escapeHtml(heading)}</div>`
                : ""
            }

            ${
              body
                ? `<div>${formatText(body)}</div>`
                : ""
            }
          </div>
        `;
      }

      if (type === "accordion") {
        return `
          <details>
            <summary>
              ${escapeHtml(heading || "詳細")}
            </summary>

            <div class="accordion-body">
              ${formatText(body)}
            </div>
          </details>
        `;
      }

      if (type === "quote") {
        return `
          <div class="quote">
            ${
              heading
                ? `<strong>${escapeHtml(heading)}</strong><br>`
                : ""
            }

            ${formatText(body)}
          </div>
        `;
      }

      if (type === "link") {
        return `
          <div class="section">
            <a
              href="${escapeHtml(body)}"
              target="_blank"
              rel="noopener noreferrer"
            >
              ${escapeHtml(heading || body)} ↗
            </a>
          </div>
        `;
      }

      if (type === "image") {
        return `
          <div class="section">
            ${
              body
                ? `
                  <img
                    class="scenario-image"
                    src="${escapeHtml(body)}"
                    alt="${escapeHtml(heading)}"
                  >
                `
                : ""
            }

            ${
              heading
                ? `<div class="image-caption">${escapeHtml(heading)}</div>`
                : ""
            }
          </div>
        `;
      }

      return `
        <div class="section">
          ${
            heading
              ? `<h2 class="heading">${escapeHtml(heading)}</h2>`
              : ""
          }

          ${
            body
              ? `<div>${formatText(body)}</div>`
              : ""
          }
        </div>
      `;
    }


    // ========================================
    // シナリオ全体を表示
    // ========================================

    function renderScenario(scenario) {

      let html = `
        <h1 class="scenario-title">
          ${escapeHtml(scenario.title)}
        </h1>
      `;


      // メイン画像
      if (scenario.mainImage) {
        html += `
          <img
            class="main-image"
            src="${escapeHtml(scenario.mainImage)}"
            alt="${escapeHtml(scenario.title)}"
          >
        `;
      }


      // 概要
      html += `
        <div class="meta">

          ${createMetaRow(
            "システム",
            scenario.system
          )}

          ${createMetaRow(
            "タグ",
            Array.isArray(scenario.tags)
              ? scenario.tags.join(" / ")
              : scenario.tags
          )}

          ${createMetaRow(
            "人数",
            scenario.players
          )}

          ${createMetaRow(
            "時間",
            scenario.time
          )}
      `;


      // システム固有情報
      if (scenario.info) {
        scenario.info.forEach(info => {
          html += createMetaRow(
            info.label,
            info.value
          );
        });
      }


      // 備考
      html += createMetaRow(
        "備考",
        scenario.note
      );

      html += `</div>`;


      // 本文
      if (scenario.sections) {
        scenario.sections.forEach(section => {
          html += createSection(section);
        });
      }


      // HOUSE RULE
      if (
        scenario.houseRule &&
        scenario.houseRule.url
      ) {
        html += `
          <div class="house-rule">

            <div class="house-rule-title">
              HOUSE RULE
            </div>

            <a
              href="${escapeHtml(scenario.houseRule.url)}"
              target="_blank"
              rel="noopener noreferrer"
            >
              ${escapeHtml(
                scenario.houseRule.name || "ハウスルール"
              )} ↗
            </a>

          </div>
        `;
      }


      // 権利表記
      if (scenario.copyright) {
        html += `
          <div class="copyright">
            ${formatText(scenario.copyright)}
          </div>
        `;
      }


      document
        .getElementById("scenario")
        .innerHTML = html;


      document.title =
        scenario.title + " | TRPG_mug";
    }


    // ========================================
    // data.json読み込み
    // キャッシュ回避付き
    // ========================================

    fetch("data.json?v=" + Date.now())

      .then(response => {
        if (!response.ok) {
          throw new Error(
            "data.jsonを読み込めませんでした"
          );
        }

        return response.json();
      })

      .then(data => {

        const params =
          new URLSearchParams(
            window.location.search
          );

        const scenarioId =
          params.get("id") || "S001";

        const scenario =
          data.scenarios.find(
            item => item.id === scenarioId
          );

        if (!scenario) {
          throw new Error(
            "指定されたシナリオが見つかりません"
          );
        }

        renderScenario(scenario);
      })

      .catch(error => {

        console.error(error);

        document
          .getElementById("scenario")
          .innerHTML = `
            <div class="error">
              シナリオを読み込めませんでした。
            </div>
          `;
      });

  </script>

</body>
</html>
