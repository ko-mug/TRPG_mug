<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>シナリオ | TRPG_mug</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 24px 80px;
      line-height: 1.8;
      color: #333;
      background: #fff;
    }

    a {
      color: #4776a8;
    }

    .back-link {
      margin-bottom: 28px;
      font-size: 14px;
    }

    .scenario-title {
      font-size: 32px;
      line-height: 1.4;
      border-bottom: 2px solid #333;
      padding-bottom: 10px;
    }

    /* 概要 */

    .meta {
      background: #f5f5f5;
      padding: 18px 22px;
      margin: 24px 0 48px;
      border-radius: 8px;
    }

    .meta-row {
      margin: 3px 0;
    }

    /* 本文 */

    .section {
      margin: 38px 0;
    }

    .heading {
      font-size: 24px;
      margin-top: 52px;
      margin-bottom: 20px;
      padding-bottom: 6px;
      border-bottom: 1px solid #bbb;
    }

    .subheading {
      font-size: 18px;
      margin-top: 30px;
      margin-bottom: 10px;
    }

    p {
      margin: 0 0 1.2em;
    }

    /* 囲み */

    .box {
      margin: 32px 0;
      padding: 18px 22px;
      border: 1px solid #bbb;
      border-radius: 8px;
      background: #fafafa;
    }

    .box-title {
      font-weight: bold;
      margin-bottom: 8px;
    }

    /* 折り畳み */

    details {
      margin: 32px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      overflow: hidden;
    }

    summary {
      cursor: pointer;
      padding: 14px 18px;
      font-weight: bold;
      background: #f5f5f5;
    }

    summary:hover {
      background: #eee;
    }

    .accordion-body {
      padding: 18px 20px 6px;
    }

    /* 引用 */

    .quote {
      margin: 32px 0;
      padding-left: 20px;
      border-left: 4px solid #aaa;
      font-style: italic;
    }

    /* 画像 */

    .scenario-image {
      display: block;
      max-width: 100%;
      height: auto;
      margin-top: 12px;
      border-radius: 6px;
    }

    .image-caption {
      margin-top: 6px;
      font-size: 13px;
      color: #777;
    }

    /* 本文装飾 */

    .red {
      color: #c0392b;
    }

    .yellow {
      color: #b8860b;
    }

    .blue {
      color: #286090;
    }

    .underline {
      text-decoration: underline;
    }

    /* その他 */

    .house-rule {
      margin-top: 60px;
      padding-top: 20px;
    }

    .copyright {
      margin-top: 50px;
      padding-top: 20px;
      border-top: 1px solid #ccc;
      font-size: 12px;
      color: #777;
    }

    .error {
      padding: 20px;
      background: #fff4f4;
      border: 1px solid #e0b4b4;
      border-radius: 8px;
    }

    @media (max-width: 600px) {
      body {
        margin-top: 24px;
        padding-left: 18px;
        padding-right: 18px;
      }

      .scenario-title {
        font-size: 27px;
      }

      .heading {
        font-size: 21px;
      }
    }
  </style>
</head>


<body>

  <div class="back-link">
    <a href="index.html">
      ← シナリオ一覧へ戻る
    </a>
  </div>

  <!-- JSONから作った内容がここに入る -->
  <main id="scenario">
    読み込み中……
  </main>


  <script>

    // ========================================
    // 本文装飾
    // ========================================

    function formatText(text) {
      if (!text) return "";

      // HTMLとして解釈されないようにする
      let result = escapeHtml(text);

      // 太字
      result = result.replace(
        /\*\*(.+?)\*\*/g,
        "<strong>$1</strong>"
      );

      // 赤字
      result = result.replace(
        /\{red:(.+?)\}/g,
        '<span class="red">$1</span>'
      );

      // 黄字
      result = result.replace(
        /\{yellow:(.+?)\}/g,
        '<span class="yellow">$1</span>'
      );

      // 青字
      result = result.replace(
        /\{blue:(.+?)\}/g,
        '<span class="blue">$1</span>'
      );

      // 下線
      result = result.replace(
        /\{underline:(.+?)\}/g,
        '<span class="underline">$1</span>'
      );

      // 改行
      result = result.replace(/\n/g, "<br>");

      return result;
    }


    // ========================================
    // HTML特殊文字を安全にする
    // ========================================

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    // ========================================
    // 概要1行
    // ========================================

    function createMetaRow(label, value) {
      if (!value) return "";

      return `
        <div class="meta-row">
          <strong>${escapeHtml(label)}：</strong>${formatText(value)}
        </div>
      `;
    }


    // ========================================
    // セクションを作る
    // ========================================

    function createSection(section) {

      const type = section.type || "text";
      const heading = section.heading || "";
      const body = section.body || "";


      // 大見出し
      if (type === "heading") {
        return `
          <h2 class="heading">
            ${escapeHtml(heading)}
          </h2>
        `;
      }


      // 小見出し
      if (type === "subheading") {
        return `
          <h3 class="subheading">
            ${escapeHtml(heading)}
          </h3>
        `;
      }


      // 囲み
      if (type === "box") {
        return `
          <div class="box">

            ${heading
              ? `<div class="box-title">${escapeHtml(heading)}</div>`
              : ""
            }

            ${body
              ? `<div>${formatText(body)}</div>`
              : ""
            }

          </div>
        `;
      }


      // 折り畳み
      if (type === "accordion") {
        return `
          <details>

            <summary>
              ${escapeHtml(heading || "詳細")}
            </summary>

            <div class="accordion-body">
              ${formatText(body)}
            </div>

          </details>
        `;
      }


      // 引用
      if (type === "quote") {
        return `
          <div class="quote">

            ${heading
              ? `<strong>${escapeHtml(heading)}</strong><br>`
              : ""
            }

            ${formatText(body)}

          </div>
        `;
      }


      // リンク
      if (type === "link") {
        return `
          <div class="section">
            <a
              href="${escapeHtml(body)}"
              target="_blank"
              rel="noopener noreferrer"
            >
              ${escapeHtml(heading || body)} ↗
            </a>
          </div>
        `;
      }


      // 画像
      if (type === "image") {
        return `
          <div class="section">

            ${body
              ? `
                <img
                  class="scenario-image"
                  src="${escapeHtml(body)}"
                  alt="${escapeHtml(heading)}"
                >
              `
              : ""
            }

            ${heading
              ? `<div class="image-caption">${escapeHtml(heading)}</div>`
              : ""
            }

          </div>
        `;
      }


      // 通常テキスト
      return `
        <div class="section">

          ${heading
            ? `<h2 class="heading">${escapeHtml(heading)}</h2>`
            : ""
          }

          ${body
            ? `<div>${formatText(body)}</div>`
            : ""
          }

        </div>
      `;
    }


    // ========================================
    // シナリオページを作る
    // ========================================

    function renderScenario(scenario) {

      let html = `
        <h1 class="scenario-title">
          ${escapeHtml(scenario.title)}
        </h1>

        <div class="meta">

          ${createMetaRow("システム", scenario.system)}
          ${createMetaRow(
            "タグ",
            Array.isArray(scenario.tags)
              ? scenario.tags.join(" / ")
              : scenario.tags
          )}

          ${createMetaRow("人数", scenario.players)}
          ${createMetaRow("時間", scenario.time)}
      `;


      // ScenarioInfo
      if (scenario.info) {
        scenario.info.forEach(info => {
          html += createMetaRow(
            info.label,
            info.value
          );
        });
      }


      html += createMetaRow(
        "備考",
        scenario.note
      );


      html += `</div>`;


      // 本文
      if (scenario.sections) {
        scenario.sections.forEach(section => {
          html += createSection(section);
        });
      }


      document.getElementById("scenario").innerHTML = html;

      document.title =
        scenario.title + " | TRPG_mug";
    }


    // ========================================
    // data.jsonを読み込む
    // ========================================

    fetch("data.json")
      .then(response => {

        if (!response.ok) {
          throw new Error("data.jsonを読み込めませんでした");
        }

        return response.json();
      })

      .then(data => {

        // URL例：
        // scenario.html?id=S001

        const params =
          new URLSearchParams(window.location.search);

        const scenarioId =
          params.get("id") || "S001";


        const scenario =
          data.scenarios.find(
            item => item.id === scenarioId
          );


        if (!scenario) {
          throw new Error(
            "指定されたシナリオが見つかりません"
          );
        }


        renderScenario(scenario);

      })

      .catch(error => {

        console.error(error);

        document.getElementById("scenario").innerHTML = `
          <div class="error">
            シナリオを読み込めませんでした。
          </div>
        `;

      });

  </script>

</body>

</html>
