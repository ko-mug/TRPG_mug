<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>シナリオ一覧 | TRPG_mug</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Zen+Kaku+Gothic+Antique:wght@400;500;700&display=swap"
    rel="stylesheet"
  >

  <style>

    :root {
      --base: #f5f1e9;
      --text: #453d39;

      --blue: #579db7;
      --red: #e5483f;
      --yellow: #f4b84e;
      --teal: #16a39a;

      --coc: #e5483f;
      --magicalogia: #16a39a;
      --unknown-system: #8d8177;

      --left-width: 365px;
      --right-width: 205px;
      --header-height: 180px;
    }


    * {
      box-sizing: border-box;
    }


    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }


    body {
      overflow: hidden;
      color: var(--text);
      background: var(--base);

      font-family:
        "Zen Kaku Gothic Antique",
        sans-serif;
    }


    button,
    input {
      font: inherit;
    }


    a {
      color: inherit;
    }


    .page {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: var(--base);
    }


    /* ========================================
       青ヘッダー
    ======================================== */

    .hero {
      position: fixed;
      z-index: 10;

      top: 0;
      left: 0;
      right: 0;

      height: var(--header-height);

      background: var(--blue);
    }


    /* ========================================
       SCENARIO LIST 荷札
    ======================================== */

    .page-label {
      position: absolute;

      right: 175px;
      top: 36px;

      display: flex;
      align-items: center;
      justify-content: center;

      width: 335px;
      height: 92px;

      padding-right: 30px;

      color: #fff;
      background: var(--red);

      font-family: "Oswald", sans-serif;

      font-size: 43px;
      font-weight: 500;
      letter-spacing: 0.02em;

      transform: rotate(7deg);

      box-shadow:
        0 5px 0 rgba(0, 0, 0, 0.05);
    }


    .page-label::after {
      content: "";

      position: absolute;
      right: -46px;

      width: 92px;
      height: 92px;

      border-radius: 50%;
      background: var(--red);
    }


    .page-label::before {
      content: "";

      position: absolute;
      z-index: 2;

      right: -25px;

      width: 23px;
      height: 23px;

      border-radius: 50%;
      background: var(--blue);
    }


    /* ========================================
       左エリア
    ======================================== */

    .sidebar {
      position: fixed;
      z-index: 20;

      top: 0;
      left: 0;
      bottom: 0;

      width: var(--left-width);

      padding:
        34px
        34px
        38px;

      overflow: hidden;

      background: var(--base);

      border-right:
        3px solid var(--blue);
    }


    /* ========================================
       もどる
    ======================================== */

    .back-area {
      height: 78px;
    }


    .back-ticket {
      position: fixed;

      z-index: 40;

      top: 54px;
      left: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      width: 150px;
      height: 42px;

      padding-right: 10px;

      color: #ffffff;
      background: var(--red);

      font-size: 13px;
      font-weight: 700;

      text-decoration: none;

      filter:
        drop-shadow(5px 5px 0 var(--blue));

      transition:
        transform 0.15s ease,
        filter 0.15s ease;
    }


    .back-ticket::after {
      content: "";

      position: absolute;

      z-index: -1;

      top: 0;
      right: -21px;

      width: 42px;
      height: 42px;

      border-radius: 50%;

      background: var(--red);
    }


    .back-ticket::before {
      content: "";

      position: absolute;

      z-index: 2;

      top: 50%;
      right: -10px;

      width: 8px;
      height: 8px;

      border-radius: 50%;

      background: var(--blue);

      transform:
        translateY(-50%);
    }


    .back-ticket:hover {
      transform:
        translateY(-2px);

      filter:
        drop-shadow(5px 7px 0 var(--blue));
    }


    /* ========================================
       SYSTEM
    ======================================== */

    .system-panel {
      position: relative;

      width: 100%;
      height: 230px;

      margin-bottom: 44px;

      background: var(--blue);

      overflow: hidden;
    }


    .system-panel::before {
      content: "";

      position: absolute;
      z-index: 1;

      top: 18px;
      left: 18px;
      right: 18px;
      bottom: 18px;

      border:
        4px solid var(--base);

      pointer-events: none;
    }


    .system-panel::after {
      content: "";

      position: absolute;
      z-index: 10;

      top: 50%;
      right: -42px;

      width: 84px;
      height: 84px;

      border-radius: 50%;

      background: var(--base);

      transform:
        translateY(-50%);
    }


    .system-panel-title {
      position: absolute;
      z-index: 3;

      top: 22px;
      left: 22px;
      right: 22px;

      height: 57px;

      display: flex;
      align-items: center;
      justify-content: center;

      color: var(--blue);
      background: var(--base);

      font-family:
        "Oswald",
        sans-serif;

      font-size: 30px;
      font-weight: 500;
      letter-spacing: 0.05em;
    }


    .system-buttons {
      position: relative;
      z-index: 4;

      display: flex;
      flex-wrap: wrap;

      gap:
        12px
        10px;

      align-content: flex-start;

      padding:
        105px
        34px
        20px;
    }


    /* ========================================
       TAG
       ★ 上の半円とTAGが重ならないよう修正
    ======================================== */

    .tag-ticket {
      position: relative;

      width: 100%;
      height: 455px;

      /*
        上だけ50px。
        黄色い枠全体を下へ移動する。
      */
      padding:
        50px
        20px
        20px;

      background: var(--red);
    }


    .tag-ticket::before,
    .tag-ticket::after {
      content: "";

      position: absolute;
      z-index: 5;

      left: 50%;

      width: 72px;
      height: 72px;

      border-radius: 50%;

      background: var(--base);

      transform:
        translateX(-50%);
    }


    .tag-ticket::before {
      top: -36px;
    }


    .tag-ticket::after {
      bottom: -36px;
    }


    .tag-ticket-inner {
      position: relative;

      width: 100%;
      height: 100%;

      border:
        4px solid var(--yellow);

      padding:
        58px
        12px
        18px;
    }


    .tag-ticket-title {
      position: absolute;

      top: 0;
      left: 0;
      right: 0;

      height: 47px;

      display: flex;
      align-items: center;
      justify-content: center;

      color: var(--yellow);

      border-bottom:
        4px solid var(--yellow);

      font-family:
        "Oswald",
        sans-serif;

      font-size: 28px;
      font-weight: 500;
      letter-spacing: 0.06em;
    }


    .tag-buttons {
      display: flex;
      flex-wrap: wrap;

      gap:
        9px
        9px;

      align-content: flex-start;
    }


    /* ========================================
       フィルターボタン
    ======================================== */

    .filter-button {
      appearance: none;

      border: 0;

      padding:
        6px
        12px;

      border-radius: 999px;

      cursor: pointer;

      font-size: 12px;
      font-weight: 700;

      transition:
        transform 0.12s,
        box-shadow 0.12s;

      box-shadow:
        0 2px 0 rgba(0, 0, 0, 0.16);
    }


    .filter-button:hover {
      transform:
        translateY(-1px);
    }


    .filter-button.active {
      transform:
        translateY(2px);

      box-shadow: none;
    }


    .system-panel
    .filter-button {
      color: var(--text);
      background: var(--yellow);
    }


    .system-panel
    .filter-button.active {
      color: #fff;
      background: var(--red);
    }


    .tag-ticket
    .filter-button {
      color: var(--red);
      background: var(--base);
    }


    .tag-ticket
    .filter-button.active {
      color: var(--red);
      background: var(--yellow);
    }


    /* ========================================
       中央
    ======================================== */

    .main {
      position: fixed;

      top: var(--header-height);
      left: var(--left-width);
      right: var(--right-width);
      bottom: 0;

      overflow: hidden;

      background: var(--base);
    }


    /* ========================================
       スクロール領域
    ======================================== */

    .content-scroll {
      width: 100%;
      height: 100%;

      overflow-y: auto;
      overflow-x: hidden;

      scrollbar-gutter: stable;

      scrollbar-width: thin;

      scrollbar-color:
        var(--blue)
        #ded8ce;
    }


    .content-scroll::-webkit-scrollbar {
      width: 13px;
    }


    .content-scroll::-webkit-scrollbar-track {
      background: #ded8ce;

      border-radius: 999px;

      margin:
        14px
        0;
    }


    .content-scroll::-webkit-scrollbar-thumb {
      background: var(--blue);

      border:
        3px solid #ded8ce;

      border-radius: 999px;
    }


    .content-scroll::-webkit-scrollbar-thumb:hover {
      background: var(--teal);
    }


    .content {
      min-height: 100%;

      padding:
        42px
        38px
        90px
        48px;
    }


    /* ========================================
       検索
    ======================================== */

    .list-tools {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 22px;

      margin-bottom: 42px;
    }


    .search-box {
      width: min(360px, 100%);

      padding:
        9px
        13px;

      color: var(--text);
      background: var(--base);

      border:
        2px solid var(--blue);

      outline: none;
    }


    .search-box:focus {
      border-color: var(--red);
    }


    .tool-right {
      display: flex;

      align-items: center;

      gap: 16px;
    }


    .result-count {
      font-family:
        "Oswald",
        sans-serif;

      font-size: 14px;
      letter-spacing: 0.08em;
    }


    .reset-button {
      appearance: none;

      border: 0;
      padding: 0;

      color: var(--red);
      background: none;

      cursor: pointer;

      font-size: 12px;
      font-weight: 700;

      text-decoration: underline;
    }


    /* ========================================
       切手一覧
    ======================================== */

    .scenario-list {
      display: grid;

      grid-template-columns:
        repeat(
          3,
          minmax(180px, 240px)
        );

      justify-content: center;

      gap:
        50px
        50px;
    }


    /* ========================================
       切手
    ======================================== */

    .scenario-card {
      --stamp-color:
        var(--unknown-system);

      position: relative;

      display: block;

      width: 100%;
      aspect-ratio: 0.78;

      padding: 16px;

      color: inherit;
      background: var(--stamp-color);

      text-decoration: none;

      transition:
        transform 0.15s;
    }


    .scenario-card:hover {
      transform:
        translateY(-5px)
        rotate(-0.5deg);
    }


    .scenario-card::before {
      content: "";

      position: absolute;

      inset: -1px;

      pointer-events: none;

      background:

        radial-gradient(
          circle at 0 13px,
          var(--base) 0 7px,
          transparent 7.5px
        )
        left top /
        15px 26px
        repeat-y,

        radial-gradient(
          circle at 100% 13px,
          var(--base) 0 7px,
          transparent 7.5px
        )
        right top /
        15px 26px
        repeat-y,

        radial-gradient(
          circle at 13px 0,
          var(--base) 0 7px,
          transparent 7.5px
        )
        left top /
        26px 15px
        repeat-x,

        radial-gradient(
          circle at 13px 100%,
          var(--base) 0 7px,
          transparent 7.5px
        )
        left bottom /
        26px 15px
        repeat-x;
    }


    .stamp-inner {
      position: relative;

      z-index: 1;

      display: flex;
      flex-direction: column;

      width: 100%;
      height: 100%;

      min-height: 0;

      padding:
        10px
        10px
        12px;

      overflow: hidden;

      background: var(--base);
    }


    /* ========================================
       システムカラー
    ======================================== */

    .system-coc {
      --stamp-color:
        var(--coc);
    }


    .system-magicalogia {
      --stamp-color:
        var(--magicalogia);
    }


    /* ========================================
       サムネイル
    ======================================== */

    .thumbnail-frame {
      flex-shrink: 0;

      padding: 4px;

      margin-bottom: 10px;

      background: var(--stamp-color);
    }


    .thumbnail {
      display: block;

      width: 100%;

      aspect-ratio: 16 / 9;

      object-fit: cover;

      background: #b3a58e;
    }


    .thumbnail-placeholder {
      width: 100%;

      aspect-ratio: 16 / 9;

      background: #b3a58e;
    }


    /* ========================================
       切手内テキスト
    ======================================== */

    .scenario-title {
      margin-bottom: 4px;

      font-size: 14px;
      font-weight: 700;

      line-height: 1.45;

      overflow-wrap: anywhere;
      word-break: break-word;
    }


    .scenario-system {
      flex-shrink: 0;

      margin-bottom: 8px;

      color: var(--stamp-color);

      font-family:
        "Oswald",
        "Zen Kaku Gothic Antique",
        sans-serif;

      font-size: 11px;
      font-weight: 600;

      letter-spacing: 0.04em;
    }


    .tags {
      display: flex;
      flex-wrap: wrap;

      gap: 4px;

      margin-bottom: 8px;
    }


    .tag {
      padding:
        1px
        6px;

      border-radius: 999px;

      background:
        color-mix(
          in srgb,
          var(--stamp-color) 14%,
          var(--base)
        );

      font-size: 9px;
      line-height: 1.7;
    }


    /* ========================================
       人数・時間
    ======================================== */

    .scenario-info {
      flex-shrink: 0;

      display: flex;
      flex-wrap: wrap;

      gap:
        5px
        12px;

      margin-top: auto;

      padding-top: 9px;

      border-top:
        1px solid
        color-mix(
          in srgb,
          var(--stamp-color) 35%,
          transparent
        );

      font-size: 11px;
      font-weight: 700;

      line-height: 1.45;
    }


    .info-item {
      white-space: normal;

      overflow-wrap: anywhere;
    }


    /* ========================================
       右ナビ
    ======================================== */

    .right-nav {
      position: fixed;

      z-index: 30;

      top: 285px;
      right: 0;

      width: 160px;

      display: flex;
      flex-direction: column;
      align-items: flex-end;

      gap: 11px;

      pointer-events: none;
    }


    .nav-ticket {
      position: relative;

      display: flex;
      align-items: center;
      justify-content: center;

      width: 220px;
      min-height: 48px;

      margin-right: -82px;

      padding:
        12px
        48px
        12px
        12px;

      color: #fff;
      background: var(--blue);

      text-align: center;
      text-decoration: none;

      font-family:
        "Oswald",
        sans-serif;

      font-size: 17px;
      letter-spacing: 0.02em;

      box-shadow:
        0 3px 0 rgba(0, 0, 0, 0.12);

      transition:
        transform 0.15s,
        background 0.15s;

      pointer-events: auto;
    }


    .nav-ticket::before {
      content: "";

      position: absolute;

      left: -10px;
      top: 50%;

      width: 20px;
      height: 20px;

      border-radius: 50%;

      background: var(--base);

      transform:
        translateY(-50%);
    }


    .nav-ticket:hover {
      transform:
        translateX(-14px);
    }


    .nav-ticket.current {
      background: var(--red);

      transform:
        translateX(20px);
    }


    .nav-ticket.current:hover {
      transform:
        translateX(6px);
    }


    /* ========================================
       0件・エラー
    ======================================== */

    .no-results,
    .error {
      grid-column:
        1 / -1;

      padding: 36px;

      text-align: center;
    }


    .error {
      border:
        2px solid var(--red);
    }


    /* ========================================
       中くらいのPC
    ======================================== */

    @media (max-width: 1300px) {

      :root {
        --left-width: 330px;
        --right-width: 180px;
      }


      .sidebar {
        padding-left: 28px;
        padding-right: 28px;
      }



      .scenario-list {
        grid-template-columns:
          repeat(
            2,
            minmax(180px, 235px)
          );
      }


      .page-label {
        right: 150px;
      }

    }


    /* ========================================
       スマホ・タブレット
    ======================================== */

    @media (max-width: 760px) {

      html,
      body {
        height: auto;
      }


      body {
        overflow: auto;
      }


      .page {
        height: auto;

        overflow: visible;
      }


      .hero {
        position: relative;

        height: 125px;
      }


      .page-label {
        right: 28px;
        top: 32px;

        width: 230px;
        height: 62px;

        font-size: 29px;
      }


      .page-label::after {
        right: -31px;

        width: 62px;
        height: 62px;
      }


      .page-label::before {
        right: -18px;

        width: 17px;
        height: 17px;
      }


      /* 右ナビ */

      .right-nav {
        position: absolute;

        top: 10px;
        left: 10px;
        right: auto;

        width: auto;

        flex-direction: row;
        align-items: center;

        gap: 6px;
      }


      .nav-ticket {
        width: auto;
        min-height: 0;

        margin: 0;

        padding:
          6px
          9px;

        font-size: 11px;

        transform: none;
      }


      .nav-ticket::before {
        display: none;
      }


      .nav-ticket:hover,
      .nav-ticket.current,
      .nav-ticket.current:hover {
        transform: none;
      }


      .nav-ticket.current {
        position: relative;

        top: 4px;
      }


      /* 左エリア */

      .sidebar {
        position: relative;

        top: auto;
        left: auto;
        bottom: auto;

        width: 100%;

        padding:
          24px
          20px
          44px;

        overflow: visible;

        border-right: 0;

        border-bottom:
          3px solid var(--blue);
      }


      .back-area {
        display: none;
      }


      .system-panel {
        width: min(
          100%,
          430px
        );

        height: 210px;

        margin:
          0 auto
          58px;
      }


      .system-buttons {
        padding:
          95px
          34px
          18px;
      }


      .tag-ticket {
        width: min(
          100%,
          430px
        );

        height: auto;
        min-height: 360px;

        margin:
          0 auto;

        /*
          スマホでも同じく
          黄色枠を半円より下へ
        */
        padding:
          50px
          20px
          20px;
      }


      .tag-ticket-inner {
        min-height: 290px;
      }


      /* 中央 */

      .main {
        position: relative;

        top: auto;
        left: auto;
        right: auto;
        bottom: auto;

        overflow: visible;
      }


      .content-scroll {
        height: auto;

        overflow: visible;
      }


      .content {
        padding:
          32px
          20px
          70px;
      }


      .list-tools {
        align-items: flex-start;

        flex-direction: column;

        margin-bottom: 34px;
      }


      .search-box {
        width: 100%;
      }


      .tool-right {
        width: 100%;

        justify-content:
          space-between;
      }


      .scenario-list {
        grid-template-columns:
          repeat(
            2,
            minmax(145px, 210px)
          );

        gap:
          32px
          22px;
      }


      .scenario-card {
        padding: 13px;
      }

    }


    @media (max-width: 430px) {

      .scenario-list {
        grid-template-columns:
          minmax(
            190px,
            245px
          );

        justify-content: center;
      }

    }

  </style>
</head>


<body>

  <div class="page">


    <header class="hero">

      <div class="page-label">
        SCENARIO LIST
      </div>

    </header>


    <aside class="sidebar">


      <!-- もどる -->

      <div class="back-area">

        <a
          class="back-ticket"
          href="index.html"
        >
          ◀ もどる
        </a>

      </div>


      <!-- SYSTEM -->

      <section
        id="system-filter-group"
        class="system-panel"
      >

        <div class="system-panel-title">
          SYSTEM
        </div>

        <div
          id="system-filters"
          class="system-buttons"
        ></div>

      </section>


      <!-- TAG -->

      <section
        id="tag-filter-group"
        class="tag-ticket"
      >

        <div class="tag-ticket-inner">

          <div class="tag-ticket-title">
            TAG
          </div>

          <div
            id="tag-filters"
            class="tag-buttons"
          ></div>

        </div>

      </section>

    </aside>


    <main class="main">

      <div class="content-scroll">

        <div class="content">


          <div class="list-tools">

            <input
              id="search"
              class="search-box"
              type="search"
              placeholder="シナリオを検索..."
            >

            <div class="tool-right">

              <span
                id="result-count"
                class="result-count"
              ></span>

              <button
                id="reset-filters"
                class="reset-button"
                type="button"
              >
                絞り込みを解除
              </button>

            </div>

          </div>


          <div
            id="scenario-list"
            class="scenario-list"
          >
            読み込み中……
          </div>

        </div>

      </div>

    </main>


    <!-- 右ナビ -->

    <nav class="right-nav" aria-label="サイトナビゲーション">

      <a
        class="nav-ticket"
        href="index.html"
      >
        HOME
      </a>

      <a
        class="nav-ticket"
        href="houserule.html"
      >
        HOUSE RULE
      </a>

      <a
        class="nav-ticket current"
        href="scenarios.html"
      >
        SCENARIO
      </a>

    </nav>

  </div>


  <script>

    let allScenarios = [];
    let selectedSystem = "";

    const selectedTags =
      new Set();

    let searchWord = "";


    function escapeHtml(text) {

      return String(text ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /* ========================================
       システム → 切手カラー
    ======================================== */

    function getSystemClass(system) {

      const value =
        String(system || "")
          .trim()
          .toLowerCase();


      if (
        value === "coc" ||
        value.includes("クトゥルフ")
      ) {
        return "system-coc";
      }


      if (
        value.includes("マギカロギア") ||
        value.includes("マギロギ")
      ) {
        return "system-magicalogia";
      }


      return "";

    }


    /* ========================================
       切手カード
    ======================================== */

    function createScenarioCard(
      scenario
    ) {

      const tags =
        Array.isArray(
          scenario.tags
        )
          ? scenario.tags
          : [];


      const systemClass =
        getSystemClass(
          scenario.system
        );


      return `
        <a
          class="scenario-card ${systemClass}"
          href="scenario.html?id=${
  encodeURIComponent(
    scenario.id
  )
}&theme=${
  encodeURIComponent(
    String(
      scenario.theme || "LIGHT"
    ).toUpperCase()
  )
}"
        >

          <div class="stamp-inner">


            <div class="thumbnail-frame">

              ${
                scenario.thumbnail
                  ? `
                    <img
                      class="thumbnail"
                      src="${
                        escapeHtml(
                          scenario.thumbnail
                        )
                      }"
                      alt="${
                        escapeHtml(
                          scenario.title
                        )
                      }"
                      loading="lazy"
                    >
                  `
                  : `
                    <div
                      class="thumbnail-placeholder"
                    ></div>
                  `
              }

            </div>


            <div class="scenario-title">

              ${
                escapeHtml(
                  scenario.title
                )
              }

            </div>


            ${
              scenario.system
                ? `
                  <div class="scenario-system">

                    ${
                      escapeHtml(
                        scenario.system
                      )
                    }

                  </div>
                `
                : ""
            }


            ${
              tags.length
                ? `
                  <div class="tags">

                    ${
                      tags
                        .map(
                          tag => `
                            <span class="tag">
                              ${
                                escapeHtml(
                                  tag
                                )
                              }
                            </span>
                          `
                        )
                        .join("")
                    }

                  </div>
                `
                : ""
            }


            ${
              scenario.players ||
              scenario.time
                ? `
                  <div class="scenario-info">

                    ${
                      scenario.players
                        ? `
                          <span class="info-item">
                            ● ${
                              escapeHtml(
                                scenario.players
                              )
                            }
                          </span>
                        `
                        : ""
                    }

                    ${
                      scenario.time
                        ? `
                          <span class="info-item">
                            ◷ ${
                              escapeHtml(
                                scenario.time
                              )
                            }
                          </span>
                        `
                        : ""
                    }

                  </div>
                `
                : ""
            }

          </div>

        </a>
      `;

    }


    /* ========================================
       フィルターボタン
    ======================================== */

    function createFilterButton(
      text,
      onClick
    ) {

      const button =
        document.createElement(
          "button"
        );

      button.type =
        "button";

      button.className =
        "filter-button";

      button.textContent =
        text;

      button.dataset.value =
        text;

      button.addEventListener(
        "click",
        onClick
      );

      return button;

    }


    /* ========================================
       SYSTEM
    ======================================== */

    function createSystemFilters() {

      const container =
        document.getElementById(
          "system-filters"
        );


      const systems = [
        ...new Set(
          allScenarios
            .map(
              scenario =>
                String(
                  scenario.system ||
                  ""
                ).trim()
            )
            .filter(Boolean)
        )
      ];


      systems.forEach(
        system => {

          const button =
            createFilterButton(
              system,
              () => {

                selectedSystem =
                  selectedSystem ===
                  system
                    ? ""
                    : system;

                updateFilters();

              }
            );

          container.appendChild(
            button
          );

        }
      );


      if (
        systems.length === 0
      ) {

        document
          .getElementById(
            "system-filter-group"
          )
          .hidden = true;

      }

    }


    /* ========================================
       TAG
    ======================================== */

    function createTagFilters() {

      const container =
        document.getElementById(
          "tag-filters"
        );


      const tags = [
        ...new Set(
          allScenarios.flatMap(
            scenario =>
              Array.isArray(
                scenario.tags
              )
                ? scenario.tags
                    .map(
                      tag =>
                        String(
                          tag
                        ).trim()
                    )
                    .filter(Boolean)
                : []
          )
        )
      ];


      tags.forEach(
        tag => {

          const button =
            createFilterButton(
              tag,
              () => {

                if (
                  selectedTags.has(
                    tag
                  )
                ) {

                  selectedTags.delete(
                    tag
                  );

                } else {

                  selectedTags.add(
                    tag
                  );

                }

                updateFilters();

              }
            );

          container.appendChild(
            button
          );

        }
      );


      if (
        tags.length === 0
      ) {

        document
          .getElementById(
            "tag-filter-group"
          )
          .hidden = true;

      }

    }


    /* ========================================
       絞り込み
    ======================================== */

    function getFilteredScenarios() {

      const normalizedSearch =
        searchWord
          .trim()
          .toLowerCase();


      return allScenarios.filter(
        scenario => {


          if (
            selectedSystem &&
            scenario.system !==
              selectedSystem
          ) {
            return false;
          }


          const scenarioTags =
            Array.isArray(
              scenario.tags
            )
              ? scenario.tags
              : [];


          for (
            const tag
            of selectedTags
          ) {

            if (
              !scenarioTags.includes(
                tag
              )
            ) {
              return false;
            }

          }


          if (
            normalizedSearch
          ) {

            const searchableText = [
              scenario.title,
              scenario.system,
              ...scenarioTags,
              scenario.players,
              scenario.time
            ]
              .join(" ")
              .toLowerCase();


            if (
              !searchableText.includes(
                normalizedSearch
              )
            ) {
              return false;
            }

          }


          return true;

        }
      );

    }


    /* ========================================
       一覧表示
    ======================================== */

    function renderScenarioList() {

      const list =
        document.getElementById(
          "scenario-list"
        );


      const scenarios =
        getFilteredScenarios();


      if (
        scenarios.length === 0
      ) {

        list.innerHTML = `
          <div class="no-results">
            条件に合うシナリオがありません。
          </div>
        `;

      } else {

        list.innerHTML =
          scenarios
            .map(
              createScenarioCard
            )
            .join("");

      }


      document
        .getElementById(
          "result-count"
        )
        .textContent =
          `${scenarios.length} SCENARIOS`;

    }


    /* ========================================
       選択状態
    ======================================== */

    function updateButtonStates() {

      document
        .querySelectorAll(
          "#system-filters .filter-button"
        )
        .forEach(
          button => {

            button
              .classList
              .toggle(
                "active",
                button.dataset.value ===
                  selectedSystem
              );

          }
        );


      document
        .querySelectorAll(
          "#tag-filters .filter-button"
        )
        .forEach(
          button => {

            button
              .classList
              .toggle(
                "active",
                selectedTags.has(
                  button.dataset.value
                )
              );

          }
        );

    }


    function updateFilters() {

      updateButtonStates();
      renderScenarioList();

    }


    /* ========================================
       検索
    ======================================== */

    document
      .getElementById(
        "search"
      )
      .addEventListener(
        "input",
        event => {

          searchWord =
            event.target.value;

          renderScenarioList();

        }
      );


    /* ========================================
       リセット
    ======================================== */

    document
      .getElementById(
        "reset-filters"
      )
      .addEventListener(
        "click",
        () => {

          selectedSystem = "";

          selectedTags.clear();

          searchWord = "";

          document
            .getElementById(
              "search"
            )
            .value = "";

          updateFilters();

        }
      );


    /* ========================================
       data.json
    ======================================== */

    fetch(
      "data.json?v=" +
      Date.now()
    )

      .then(
        response => {

          if (
            !response.ok
          ) {

            throw new Error(
              "data.jsonを読み込めませんでした"
            );

          }

          return response.json();

        }
      )

      .then(
        data => {

          const list =
            document.getElementById(
              "scenario-list"
            );


          if (
            !data.scenarios ||
            data.scenarios.length === 0
          ) {

            list.innerHTML =
              "現在公開されているシナリオはありません。";

            return;

          }


          allScenarios =
            data.scenarios;


          createSystemFilters();
          createTagFilters();
          updateFilters();

        }
      )

      .catch(
        error => {

          console.error(
            error
          );

          document
            .getElementById(
              "scenario-list"
            )
            .innerHTML = `
              <div class="error">
                シナリオ一覧を読み込めませんでした。
              </div>
            `;

        }
      );

  </script>

</body>
</html>
