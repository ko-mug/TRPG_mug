<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>シナリオ一覧 | TRPG_mug</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Zen+Kaku+Gothic+Antique:wght@400;500;700&display=swap"
    rel="stylesheet"
  >

  <style>

    /* ========================================
       基本カラー

       色を変えたくなったら
       まずここだけ触ればOK
    ======================================== */

    :root {
      --base: #f4f1ec;
      --text: #493f3b;

      --blue: #579db7;
      --red: #e5483f;
      --yellow: #f5b64e;
      --teal: #16a39a;

      --coc: #e5483f;
      --magicalogia: #16a39a;

      --unknown-system: #8e8278;
    }


    /* ========================================
       基本
    ======================================== */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family:
        "Zen Kaku Gothic Antique",
        sans-serif;

      color: var(--text);
      background: var(--base);
    }

    button,
    input {
      font: inherit;
    }

    a {
      color: inherit;
    }


    /* ========================================
       ページ全体
    ======================================== */

    .page {
      min-height: 100vh;
      display: grid;

      grid-template-columns:
        260px
        minmax(0, 1fr)
        110px;
    }


    /* ========================================
       左サイドバー
    ======================================== */

    .sidebar {
      position: relative;

      padding:
        34px
        24px
        60px;

      border-right:
        3px solid var(--blue);

      background: var(--base);
    }


    /* 戻る */

    .back-ticket {
      position: relative;

      display: inline-flex;
      align-items: center;

      min-width: 112px;
      height: 42px;

      margin-bottom: 34px;
      padding:
        0
        28px
        0
        18px;

      color: #fff;
      background: var(--red);

      text-decoration: none;
      font-weight: 700;

      border-radius:
        0
        7px
        7px
        0;
    }

    .back-ticket::after {
      content: "";

      position: absolute;
      right: -10px;
      top: 11px;

      width: 20px;
      height: 20px;

      border-radius: 50%;

      background: var(--base);
    }

    .back-ticket::before {
      content: "";

      position: absolute;
      right: -3px;
      top: 17px;

      z-index: 2;

      width: 8px;
      height: 8px;

      border-radius: 50%;

      background: var(--blue);
    }


    /* ========================================
       SYSTEM
    ======================================== */

    .system-panel {
      position: relative;

      margin-bottom: 30px;
      padding:
        50px
        18px
        20px;

      border:
        14px solid var(--blue);

      background: var(--base);
    }

    .system-panel-title {
      position: absolute;
      top: 7px;
      left: 12px;
      right: 12px;

      padding-bottom: 5px;

      text-align: center;

      font-family:
        "Oswald",
        sans-serif;

      font-size: 24px;
      font-weight: 500;

      color: var(--blue);

      border-bottom:
        2px solid var(--blue);
    }

    .system-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }


    /* ========================================
       TAGチケット
    ======================================== */

    .tag-ticket {
      position: relative;

      min-height: 370px;

      padding:
        70px
        22px
        28px;

      background: var(--red);
    }

    .tag-ticket::before,
    .tag-ticket::after {
      content: "";

      position: absolute;
      left: 50%;

      width: 70px;
      height: 70px;

      border-radius: 50%;

      background: var(--base);

      transform:
        translateX(-50%);
    }

    .tag-ticket::before {
      top: -35px;
    }

    .tag-ticket::after {
      bottom: -35px;
    }

    .tag-ticket-inner {
      min-height: 270px;

      padding:
        14px
        12px
        28px;

      border:
        3px solid var(--yellow);
    }

    .tag-ticket-title {
      margin-bottom: 18px;
      padding-bottom: 7px;

      border-bottom:
        3px solid var(--yellow);

      color: var(--yellow);

      text-align: center;

      font-family:
        "Oswald",
        sans-serif;

      font-size: 27px;
      font-weight: 500;
    }

    .tag-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }


    /* ========================================
       絞り込みボタン
    ======================================== */

    .filter-button {
      appearance: none;

      border: 0;

      padding:
        6px
        12px;

      border-radius: 999px;

      background: var(--yellow);
      color: var(--text);

      cursor: pointer;

      font-size: 12px;
      font-weight: 700;

      box-shadow:
        0 2px 0 rgba(0, 0, 0, 0.18);

      transition:
        transform 0.12s,
        box-shadow 0.12s;
    }

    .filter-button:hover {
      transform:
        translateY(-1px);
    }

    .filter-button.active {
      transform:
        translateY(2px);

      box-shadow: none;
    }

    .system-panel
    .filter-button.active {
      color: #fff;
      background: var(--blue);
    }

    .tag-ticket
    .filter-button {
      color: var(--red);
      background: var(--base);
    }

    .tag-ticket
    .filter-button.active {
      color: #fff;
      background: var(--yellow);
    }


    /* ========================================
       メイン
    ======================================== */

    .main {
      min-width: 0;
    }


    /* ========================================
       上部の青い帯
    ======================================== */

    .hero {
      position: relative;

      height: 155px;

      background: var(--blue);

      overflow: hidden;
    }


    /* SCENARIO LIST 荷札 */

    .page-label {
      position: absolute;

      right: 38px;
      top: 28px;

      display: flex;
      align-items: center;
      justify-content: center;

      width: 245px;
      height: 72px;

      padding-right: 18px;

      color: #fff;
      background: var(--red);

      font-family:
        "Oswald",
        sans-serif;

      font-size: 31px;
      font-weight: 500;

      transform:
        rotate(8deg);

      box-shadow:
        0 4px 0 rgba(0, 0, 0, 0.05);
    }

    .page-label::after {
      content: "";

      position: absolute;
      right: -35px;

      width: 70px;
      height: 70px;

      border-radius: 50%;

      background: var(--red);
    }

    .page-label::before {
      content: "";

      position: absolute;
      z-index: 2;

      right: -20px;

      width: 20px;
      height: 20px;

      border-radius: 50%;

      background: var(--blue);
    }


    /* ========================================
       一覧本体
    ======================================== */

    .content {
      padding:
        42px
        48px
        80px;
    }


    /* 検索・件数 */

    .list-tools {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 20px;

      margin-bottom: 34px;
    }

    .search-box {
      width: min(360px, 100%);

      padding:
        9px
        13px;

      border:
        2px solid var(--blue);

      background: var(--base);

      color: var(--text);

      outline: none;
    }

    .search-box:focus {
      border-color: var(--red);
    }

    .result-count {
      flex-shrink: 0;

      font-family:
        "Oswald",
        sans-serif;

      font-size: 14px;

      letter-spacing: 0.08em;
    }

    .reset-button {
      appearance: none;

      border: 0;
      padding: 0;

      color: var(--red);
      background: none;

      cursor: pointer;

      font-size: 12px;
      font-weight: 700;

      text-decoration: underline;
    }


    /* ========================================
       切手一覧
    ======================================== */

    .scenario-list {
      display: grid;

      grid-template-columns:
        repeat(
          3,
          minmax(0, 1fr)
        );

      gap:
        38px
        46px;
    }


    /* ========================================
       切手

       ギザギザと内側の縁を
       同じシステムカラーで作る
    ======================================== */

    .scenario-card {
      --stamp-color:
        var(--unknown-system);

      position: relative;

      display: block;

      padding: 18px;

      color: inherit;
      background: var(--stamp-color);

      text-decoration: none;

      transition:
        transform 0.15s;
    }

    .scenario-card:hover {
      transform:
        translateY(-4px)
        rotate(-0.4deg);
    }


    /*
      切手穴。

      ベース色の丸を並べて
      色面を「抜く」ことで、
      波線ではなく大きな
      切手のギザギザにする。
    */

    .scenario-card::before {
      content: "";

      position: absolute;
      inset: -1px;

      pointer-events: none;

      background:
        radial-gradient(
          circle at 0 12px,
          var(--base) 0 7px,
          transparent 7.5px
        )
        left top / 14px 24px repeat-y,

        radial-gradient(
          circle at 100% 12px,
          var(--base) 0 7px,
          transparent 7.5px
        )
        right top / 14px 24px repeat-y,

        radial-gradient(
          circle at 12px 0,
          var(--base) 0 7px,
          transparent 7.5px
        )
        left top / 24px 14px repeat-x,

        radial-gradient(
          circle at 12px 100%,
          var(--base) 0 7px,
          transparent 7.5px
        )
        left bottom / 24px 14px repeat-x;
    }


    /* 切手の白い中身 */

    .stamp-inner {
      position: relative;
      z-index: 1;

      min-height: 100%;

      padding:
        10px
        10px
        13px;

      background: var(--base);
    }


    /* システムカラー */

    .system-coc {
      --stamp-color:
        var(--coc);
    }

    .system-magicalogia {
      --stamp-color:
        var(--magicalogia);
    }


    /* ========================================
       サムネイル
    ======================================== */

    .thumbnail-frame {
      padding: 5px;

      background:
        var(--stamp-color);

      margin-bottom: 12px;
    }

    .thumbnail {
      display: block;

      width: 100%;
      aspect-ratio: 16 / 9;

      object-fit: cover;

      background: #b2a183;
    }

    .thumbnail-placeholder {
      width: 100%;
      aspect-ratio: 16 / 9;

      background:
        #a79574;
    }


    /* ========================================
       切手内の情報
    ======================================== */

    .scenario-title {
      margin-bottom: 5px;

      font-size: 15px;
      font-weight: 700;

      line-height: 1.45;
    }

    .scenario-system {
      margin-bottom: 9px;

      font-family:
        "Oswald",
        "Zen Kaku Gothic Antique",
        sans-serif;

      color:
        var(--stamp-color);

      font-size: 12px;
      font-weight: 600;

      letter-spacing: 0.03em;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;

      margin-bottom: 11px;
    }

    .tag {
      padding:
        2px
        7px;

      border-radius: 999px;

      background:
        color-mix(
          in srgb,
          var(--stamp-color) 14%,
          var(--base)
        );

      font-size: 10px;
      line-height: 1.6;
    }

    .scenario-info {
      display: flex;
      flex-wrap: wrap;

      gap:
        5px
        14px;

      padding-top: 9px;

      border-top:
        1px solid
        color-mix(
          in srgb,
          var(--stamp-color) 35%,
          transparent
        );

      font-size: 11px;
    }

    .info-item {
      white-space: nowrap;
    }


    /* ========================================
       右ナビ
    ======================================== */

    .right-nav {
      display: flex;
      flex-direction: column;
      align-items: flex-end;

      gap: 10px;

      padding-top: 260px;

      overflow: hidden;
    }

    .nav-ticket {
      display: block;

      width: 102px;

      padding:
        12px
        8px;

      color: #fff;
      background: var(--blue);

      text-align: center;
      text-decoration: none;

      font-family:
        "Oswald",
        sans-serif;

      font-size: 17px;

      box-shadow:
        0 3px 0 rgba(0, 0, 0, 0.12);

      transition:
        width 0.15s,
        background 0.15s;
    }

    .nav-ticket:hover {
      width: 108px;
      background: var(--red);
    }

    .nav-ticket.current {
      background: var(--red);
    }


    /* ========================================
       0件・エラー
    ======================================== */

    .no-results,
    .error {
      grid-column:
        1 / -1;

      padding: 32px;

      text-align: center;
    }

    .error {
      border:
        2px solid var(--red);
    }


    /* ========================================
       タブレット
    ======================================== */

    @media (max-width: 1100px) {

      .page {
        grid-template-columns:
          220px
          minmax(0, 1fr)
          80px;
      }

      .sidebar {
        padding-left: 18px;
        padding-right: 18px;
      }

      .content {
        padding-left: 30px;
        padding-right: 30px;
      }

      .scenario-list {
        grid-template-columns:
          repeat(
            2,
            minmax(0, 1fr)
          );
      }

      .nav-ticket {
        width: 76px;
        font-size: 14px;
      }

    }


    /* ========================================
       スマホ
    ======================================== */

    @media (max-width: 760px) {

      .page {
        display: block;
      }


      /* ヘッダー */

      .main {
        display: flex;
        flex-direction: column;
      }

      .hero {
        order: 1;
        height: 110px;
      }

      .page-label {
        right: 22px;
        top: 25px;

        width: 190px;
        height: 56px;

        font-size: 24px;
      }


      /* 右ナビを上へ */

      .right-nav {
        position: absolute;
        z-index: 10;

        top: 12px;
        left: 12px;
        right: 12px;

        display: flex;
        flex-direction: row;
        justify-content: flex-start;

        gap: 7px;

        padding: 0;

        overflow: visible;
      }

      .nav-ticket {
        width: auto;

        padding:
          7px
          10px;

        font-size: 12px;
      }

      .nav-ticket:hover {
        width: auto;
      }


      /* 左サイドバーを
         絞り込みエリアとして上へ */

      .sidebar {
        border-right: 0;
        border-bottom:
          3px solid var(--blue);

        padding:
          22px
          18px
          30px;
      }

      .back-ticket {
        display: none;
      }

      .system-panel {
        margin-top: 0;
        margin-bottom: 22px;
      }

      .tag-ticket {
        min-height: 0;

        margin:
          34px
          0
          10px;

        padding:
          54px
          18px
          50px;
      }

      .tag-ticket-inner {
        min-height: 0;
      }


      /* 本文 */

      .content {
        order: 2;

        padding:
          30px
          18px
          60px;
      }

      .list-tools {
        align-items: flex-start;
        flex-direction: column;
      }

      .search-box {
        width: 100%;
      }

      .scenario-list {
        grid-template-columns:
          repeat(
            2,
            minmax(0, 1fr)
          );

        gap:
          26px
          18px;
      }

      .scenario-card {
        padding: 14px;
      }

      .stamp-inner {
        padding:
          8px
          8px
          11px;
      }

      .scenario-title {
        font-size: 13px;
      }

      .scenario-system {
        font-size: 11px;
      }

      .scenario-info {
        display: block;
      }

      .info-item + .info-item {
        margin-top: 3px;
      }

    }


    /* かなり狭いスマホ */

    @media (max-width: 420px) {

      .scenario-list {
        grid-template-columns: 1fr;

        max-width: 270px;

        margin:
          0 auto;
      }

    }

  </style>
</head>


<body>

  <div class="page">


    <!-- =====================================
         左：絞り込み
    ====================================== -->

    <aside class="sidebar">

      <a
        class="back-ticket"
        href="index.html"
      >
        ◀ もどる
      </a>


      <!-- SYSTEM -->

      <section
        id="system-filter-group"
        class="system-panel"
      >

        <div class="system-panel-title">
          SYSTEM
        </div>

        <div
          id="system-filters"
          class="system-buttons"
        ></div>

      </section>


      <!-- TAG -->

      <section
        id="tag-filter-group"
        class="tag-ticket"
      >

        <div class="tag-ticket-inner">

          <div class="tag-ticket-title">
            TAG
          </div>

          <div
            id="tag-filters"
            class="tag-buttons"
          ></div>

        </div>

      </section>

    </aside>


    <!-- =====================================
         中央
    ====================================== -->

    <main class="main">


      <!-- 青帯 -->

      <header class="hero">

        <div class="page-label">
          SCENARIO LIST
        </div>

      </header>


      <!-- 一覧 -->

      <div class="content">

        <div class="list-tools">

          <input
            id="search"
            class="search-box"
            type="search"
            placeholder="シナリオを検索..."
          >

          <div>

            <span
              id="result-count"
              class="result-count"
            ></span>

            &nbsp;&nbsp;

            <button
              id="reset-filters"
              class="reset-button"
              type="button"
            >
              絞り込みを解除
            </button>

          </div>

        </div>


        <div
          id="scenario-list"
          class="scenario-list"
        >
          読み込み中……
        </div>

      </div>

    </main>


    <!-- =====================================
         右：ナビ
    ====================================== -->

    <nav class="right-nav">

      <a
        class="nav-ticket"
        href="index.html"
      >
        HOME
      </a>

      <a
        class="nav-ticket"
        href="houserule.html"
      >
        HOUSE RULE
      </a>

      <a
        class="nav-ticket current"
        href="scenarios.html"
      >
        SCENARIO
      </a>

    </nav>

  </div>


  <script>

    // ========================================
    // 状態
    // ========================================

    let allScenarios = [];

    let selectedSystem = "";

    const selectedTags =
      new Set();

    let searchWord = "";


    // ========================================
    // HTML特殊文字
    // ========================================

    function escapeHtml(text) {

      return String(text ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    // ========================================
    // システム → CSSクラス
    // ========================================

    function getSystemClass(system) {

      const value =
        String(system || "")
          .trim()
          .toLowerCase();


      if (
        value === "coc" ||
        value.includes(
          "クトゥルフ"
        )
      ) {
        return "system-coc";
      }


      if (
        value.includes(
          "マギカロギア"
        ) ||
        value.includes(
          "マギロギ"
        )
      ) {
        return "system-magicalogia";
      }


      return "";

    }


    // ========================================
    // 切手カード
    // ========================================

    function createScenarioCard(
      scenario
    ) {

      const tags =
        Array.isArray(
          scenario.tags
        )
          ? scenario.tags
          : [];


      const systemClass =
        getSystemClass(
          scenario.system
        );


      return `
        <a
          class="
            scenario-card
            ${systemClass}
          "
          href="
            scenario.html?id=${
              encodeURIComponent(
                scenario.id
              )
            }
          "
        >

          <div class="stamp-inner">


            <!-- サムネイル -->

            <div class="thumbnail-frame">

              ${
                scenario.thumbnail
                  ? `
                    <img
                      class="thumbnail"
                      src="${
                        escapeHtml(
                          scenario.thumbnail
                        )
                      }"
                      alt="${
                        escapeHtml(
                          scenario.title
                        )
                      }"
                      loading="lazy"
                    >
                  `
                  : `
                    <div
                      class="
                        thumbnail-placeholder
                      "
                    ></div>
                  `
              }

            </div>


            <!-- タイトル -->

            <div class="scenario-title">
              ${
                escapeHtml(
                  scenario.title
                )
              }
            </div>


            <!-- システム -->

            ${
              scenario.system
                ? `
                  <div
                    class="
                      scenario-system
                    "
                  >
                    ${
                      escapeHtml(
                        scenario.system
                      )
                    }
                  </div>
                `
                : ""
            }


            <!-- タグ -->

            ${
              tags.length
                ? `
                  <div class="tags">

                    ${
                      tags
                        .map(
                          tag => `
                            <span
                              class="tag"
                            >
                              ${
                                escapeHtml(
                                  tag
                                )
                              }
                            </span>
                          `
                        )
                        .join("")
                    }

                  </div>
                `
                : ""
            }


            <!-- 人数・時間 -->

            ${
              scenario.players ||
              scenario.time
                ? `
                  <div
                    class="
                      scenario-info
                    "
                  >

                    ${
                      scenario.players
                        ? `
                          <span
                            class="
                              info-item
                            "
                          >
                            ● ${
                              escapeHtml(
                                scenario.players
                              )
                            }
                          </span>
                        `
                        : ""
                    }

                    ${
                      scenario.time
                        ? `
                          <span
                            class="
                              info-item
                            "
                          >
                            ◷ ${
                              escapeHtml(
                                scenario.time
                              )
                            }
                          </span>
                        `
                        : ""
                    }

                  </div>
                `
                : ""
            }

          </div>

        </a>
      `;

    }


    // ========================================
    // 絞り込みボタン
    // ========================================

    function createFilterButton(
      text,
      onClick
    ) {

      const button =
        document.createElement(
          "button"
        );

      button.type =
        "button";

      button.className =
        "filter-button";

      button.textContent =
        text;

      button.dataset.value =
        text;

      button.addEventListener(
        "click",
        onClick
      );

      return button;

    }


    // ========================================
    // SYSTEM
    // ========================================

    function createSystemFilters() {

      const container =
        document.getElementById(
          "system-filters"
        );


      const systems = [
        ...new Set(
          allScenarios
            .map(
              scenario =>
                String(
                  scenario.system ||
                  ""
                ).trim()
            )
            .filter(Boolean)
        )
      ];


      systems.forEach(
        system => {

          const button =
            createFilterButton(
              system,
              () => {

                selectedSystem =
                  selectedSystem ===
                  system
                    ? ""
                    : system;

                updateFilters();

              }
            );

          container.appendChild(
            button
          );

        }
      );


      if (
        systems.length === 0
      ) {

        document
          .getElementById(
            "system-filter-group"
          )
          .hidden = true;

      }

    }


    // ========================================
    // TAG
    // ========================================

    function createTagFilters() {

      const container =
        document.getElementById(
          "tag-filters"
        );


      const tags = [
        ...new Set(
          allScenarios.flatMap(
            scenario =>
              Array.isArray(
                scenario.tags
              )
                ? scenario.tags
                    .map(
                      tag =>
                        String(
                          tag
                        ).trim()
                    )
                    .filter(Boolean)
                : []
          )
        )
      ];


      tags.forEach(
        tag => {

          const button =
            createFilterButton(
              tag,
              () => {

                if (
                  selectedTags.has(
                    tag
                  )
                ) {

                  selectedTags.delete(
                    tag
                  );

                } else {

                  selectedTags.add(
                    tag
                  );

                }

                updateFilters();

              }
            );

          container.appendChild(
            button
          );

        }
      );


      if (
        tags.length === 0
      ) {

        document
          .getElementById(
            "tag-filter-group"
          )
          .hidden = true;

      }

    }


    // ========================================
    // 絞り込み
    // ========================================

    function getFilteredScenarios() {

      const normalizedSearch =
        searchWord
          .trim()
          .toLowerCase();


      return allScenarios.filter(
        scenario => {


          /* SYSTEM */

          if (
            selectedSystem &&
            scenario.system !==
              selectedSystem
          ) {
            return false;
          }


          /* TAG */

          const scenarioTags =
            Array.isArray(
              scenario.tags
            )
              ? scenario.tags
              : [];


          for (
            const tag
            of selectedTags
          ) {

            if (
              !scenarioTags.includes(
                tag
              )
            ) {
              return false;
            }

          }


          /* 検索 */

          if (
            normalizedSearch
          ) {

            const searchableText = [
              scenario.title,
              scenario.system,
              ...scenarioTags,
              scenario.players,
              scenario.time
            ]
              .join(" ")
              .toLowerCase();


            if (
              !searchableText.includes(
                normalizedSearch
              )
            ) {
              return false;
            }

          }


          return true;

        }
      );

    }


    // ========================================
    // 一覧表示
    // ========================================

    function renderScenarioList() {

      const list =
        document.getElementById(
          "scenario-list"
        );


      const scenarios =
        getFilteredScenarios();


      if (
        scenarios.length === 0
      ) {

        list.innerHTML = `
          <div
            class="no-results"
          >
            条件に合うシナリオがありません。
          </div>
        `;

      } else {

        list.innerHTML =
          scenarios
            .map(
              createScenarioCard
            )
            .join("");

      }


      document
        .getElementById(
          "result-count"
        )
        .textContent =
          `${scenarios.length} SCENARIOS`;

    }


    // ========================================
    // 選択状態
    // ========================================

    function updateButtonStates() {

      document
        .querySelectorAll(
          "#system-filters .filter-button"
        )
        .forEach(
          button => {

            button
              .classList
              .toggle(
                "active",
                button.dataset.value ===
                  selectedSystem
              );

          }
        );


      document
        .querySelectorAll(
          "#tag-filters .filter-button"
        )
        .forEach(
          button => {

            button
              .classList
              .toggle(
                "active",
                selectedTags.has(
                  button.dataset.value
                )
              );

          }
        );

    }


    function updateFilters() {

      updateButtonStates();

      renderScenarioList();

    }


    // ========================================
    // 検索
    // ========================================

    document
      .getElementById(
        "search"
      )
      .addEventListener(
        "input",
        event => {

          searchWord =
            event.target.value;

          renderScenarioList();

        }
      );


    // ========================================
    // リセット
    // ========================================

    document
      .getElementById(
        "reset-filters"
      )
      .addEventListener(
        "click",
        () => {

          selectedSystem = "";

          selectedTags.clear();

          searchWord = "";

          document
            .getElementById(
              "search"
            )
            .value = "";

          updateFilters();

        }
      );


    // ========================================
    // data.json
    // ========================================

    fetch(
      "data.json?v=" +
      Date.now()
    )

      .then(
        response => {

          if (
            !response.ok
          ) {

            throw new Error(
              "data.jsonを読み込めませんでした"
            );

          }

          return response.json();

        }
      )

      .then(
        data => {

          const list =
            document.getElementById(
              "scenario-list"
            );


          if (
            !data.scenarios ||
            data.scenarios.length === 0
          ) {

            list.innerHTML =
              "現在公開されているシナリオはありません。";

            return;

          }


          allScenarios =
            data.scenarios;


          createSystemFilters();

          createTagFilters();

          updateFilters();

        }
      )

      .catch(
        error => {

          console.error(
            error
          );

          document
            .getElementById(
              "scenario-list"
            )
            .innerHTML = `
              <div class="error">
                シナリオ一覧を読み込めませんでした。
              </div>
            `;

        }
      );

  </script>

</body>
</html>
