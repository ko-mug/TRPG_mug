<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRPG_mug</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Zen+Kaku+Gothic+Antique:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--base:#f5f1e9;--text:#453d39;--blue:#579db7;--red:#e5483f;--yellow:#f4b84e;--teal:#16a39a;--header-height:180px}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0}
body{overflow:hidden;color:var(--text);background:var(--base);font-family:"Zen Kaku Gothic Antique",sans-serif}
.page{position:relative;width:100%;height:100vh;overflow:hidden;background:var(--base)}
.hero{position:fixed;z-index:10;top:0;left:0;right:0;height:var(--header-height);background:var(--blue)}
.page-label{position:absolute;right:175px;top:36px;display:flex;align-items:center;justify-content:center;width:335px;height:92px;padding-right:30px;color:#fff;background:var(--red);font-family:"Oswald",sans-serif;font-size:43px;font-weight:500;letter-spacing:.02em;transform:rotate(7deg);box-shadow:0 5px 0 rgba(0,0,0,.05)}
.page-label::after{content:"";position:absolute;right:-46px;width:92px;height:92px;border-radius:50%;background:var(--red)}
.page-label::before{content:"";position:absolute;z-index:2;right:-25px;width:23px;height:23px;border-radius:50%;background:var(--blue)}
.home-main{position:fixed;top:var(--header-height);left:0;right:0;bottom:0;display:flex;justify-content:center;overflow:hidden;background:var(--base)}
.home-content{width:100%;max-width:800px;padding:82px 24px 60px;text-align:center}
.site-title{margin:0 0 82px;color:var(--red);font-family:"Oswald",sans-serif;font-size:34px;font-weight:500;line-height:1;letter-spacing:-.02em}
.home-nav{display:flex;flex-direction:column;align-items:center;gap:24px}
.home-ticket{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;width:220px;min-height:48px;padding:12px 28px 12px 18px;color:#fff;background:var(--blue);text-align:center;text-decoration:none;font-family:"Oswald",sans-serif;font-size:17px;letter-spacing:.02em;box-shadow:0 3px 0 rgba(0,0,0,.12);transition:transform .15s,box-shadow .15s}
.home-ticket::after{content:"";position:absolute;z-index:-1;top:0;right:-24px;width:48px;height:48px;border-radius:50%;background:var(--blue)}
.home-ticket::before{content:"";position:absolute;z-index:2;top:50%;right:-13px;width:9px;height:9px;border-radius:50%;background:var(--base);transform:translateY(-50%)}
.home-ticket:hover{transform:translateY(-3px);box-shadow:0 6px 0 rgba(0,0,0,.10)}
.home-ticket:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.12)}
@media(max-width:760px){
:root{--header-height:125px}
.page-label{right:28px;top:32px;width:230px;height:62px;font-size:29px}
.page-label::after{right:-31px;width:62px;height:62px}
.page-label::before{right:-18px;width:17px;height:17px}
.home-content{padding:72px 20px 50px}
.site-title{margin-bottom:64px;font-size:30px}
.home-nav{gap:20px}
.home-ticket{width:205px;min-height:46px;font-size:16px}
.home-ticket::after{right:-23px;width:46px;height:46px}
}
</style>
</head>
<body>
<div class="page">
<header class="hero"><div class="page-label">HOME</div></header>
<main class="home-main">
<div class="home-content">
<h1 class="site-title">TRPG_mug</h1>
<nav class="home-nav" aria-label="メインメニュー">
<a class="home-ticket" href="houserule.html">HOUSERULE</a>
<a class="home-ticket" href="scenarios.html">SCENARIO LIST</a>
</nav>
</div>
</main>
</div>
</body>
</html>
